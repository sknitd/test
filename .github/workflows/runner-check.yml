name: Runner check
on:
  push:
    branches: ["ccr-98b7fad9-jid67a"]
    paths: [".github/workflows/runner-check.yml"]
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: |
          uname -a
          if [ "$(uname)" = Darwin ]; then sw_vers; xcodebuild -version; swift --version; ls /Applications | grep -i xcode; fi
