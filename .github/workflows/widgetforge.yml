name: WidgetForge

on:
  push:
    paths:
      - "WidgetForge/**"
      - ".github/workflows/widgetforge.yml"
  workflow_dispatch:

concurrency:
  group: widgetforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux, Swift 5.10)
    runs-on: ubuntu-24.04
    container: swift:5.10-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: WidgetForge
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log | grep -E "error:|Build complete" | sort -u | head -n 120
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | grep -vE "^Test Case .* (started|passed)" | tail -n 200

  core-macos:
    name: Core tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WidgetForge
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log | grep -E "error:|Build complete" | sort -u | head -n 120
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | grep -vE "^Test Case .* (started|passed)" | tail -n 200

  app:
    name: Build app, self-test, package
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: WidgetForge
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Project file is up to date
        run: |
          python3 Scripts/generate_xcodeproj.py
          git diff --exit-code -- WidgetForge.xcodeproj
          plutil -lint WidgetForge.xcodeproj/project.pbxproj Config/*.plist Config/*.entitlements
      - name: Build (Release, universal, ad-hoc signed)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          Scripts/build_app.sh Release > build/xcodebuild.log 2>&1 || {
            echo "::group::Errors"
            grep -E "error:|error :|BUILD FAILED|The following build commands failed" build/xcodebuild.log | sed -E "s#$PWD/##" | sort -u | head -n 150
            echo "::endgroup::"
            exit 1
          }
          grep -E "warning:" build/xcodebuild.log | sed -E "s#$PWD/##" | sort -u | head -n 40 || true
          tail -n 6 build/xcodebuild.log
      - name: Inspect bundle
        run: |
          ls build/WidgetForge.app/Contents build/WidgetForge.app/Contents/PlugIns
          codesign -d --entitlements - build/WidgetForge.app 2>&1 | head -n 40
          du -sh build/WidgetForge.app
      - name: Self-test (launches the real app and measures it)
        shell: bash
        run: |
          set -o pipefail
          ( sleep 28; screencapture -x build/desktop.png || true ) &
          build/WidgetForge.app/Contents/MacOS/WidgetForge --self-test --hold 8 2>build/selftest.err | tee build/selftest.txt | head -n 260
          wait || true
          grep -q WIDGETFORGE_SELFTEST_END build/selftest.txt
          tail -n 20 build/selftest.err || true
      - name: Package DMG
        run: Scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WidgetForge
          path: |
            WidgetForge/build/WidgetForge.dmg
            WidgetForge/build/desktop.png
            WidgetForge/build/selftest.txt
            WidgetForge/build/xcodebuild.log
          if-no-files-found: warn
